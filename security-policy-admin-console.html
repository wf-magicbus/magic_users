    .main-content { max-width: 1440px; margin: 0 auto; padding: 32px; }

      background: rgba(255,255,255,0.82); border-radius: 18px; padding: 8px; display: inline-flex; gap: 6px;

      display: flex; align-items: center; gap: 8px;

    .policy-inline { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    .policy-inline .form-input, .policy-inline .form-select { flex: 1; min-width: 140px; }

      .search-filter-bar { flex-direction: column; }
      .search-input, .filter-select, .btn { width: 100%; }
      .policy-grid { grid-template-columns: 1fr; }
      .header-title h1 { font-size: 20px; }
      .header-content, .header-title, .group-card-header { align-items: stretch; }
    }
  </style>
</head>

      { category: 'URL BlockAllow Lists', name: 'Blocks categories', description: 'septrate URLs and WEB categories to be allowed or blocked', enabled: true, type: 'textarea', value: '' },
      { category: 'URL BlockAllow Lists', name: 'Allowed categories', description: 'septrate URLs and WEB categories to be allowed or blocked', enabled: true, type: 'textarea', value: '' },
    ];

    function clonePoliciesForScope(scope) {
      return BASE_POLICIES.map((policy, index) => ({
        id: `${scope}-${index + 1}-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`,
        scope,
        ...policy,
        options: policy.options ? [...policy.options] : undefined,
      }));
    }

    function createDefaultPolicies() {
      return [...clonePoliciesForScope('Admin'), ...clonePoliciesForScope('User')];
    }

    function getTodayISO() {
      const d = new Date();
      const yyyy = d.getFullYear();
      const mm = String(d.getMonth() + 1).padStart(2, '0');
      const dd = String(d.getDate()).padStart(2, '0');
      return `${yyyy}-${mm}-${dd}`;
    }

    function App() {
      const [activeTab, setActiveTab] = useState('users');
      const [users, setUsers] = useState(SAMPLEUSERS);
      const [policies, setPolicies] = useState(createDefaultPolicies());
      const [groups, setGroups] = useState([]);
      const [searchTerm, setSearchTerm] = useState('');
      const [filterRole, setFilterRole] = useState('All Users');
      const [policySearch, setPolicySearch] = useState('');
      const [policyScopeFilter, setPolicyScopeFilter] = useState('All');
      const [policyCategoryFilter, setPolicyCategoryFilter] = useState('All');
      const [editingUser, setEditingUser] = useState(null);
      const [editingGroup, setEditingGroup] = useState(null);
      const handleDeleteGroup = (groupId) => {
        if (confirm('Are you sure you want to delete this group and all its policies?')) {
          const groupToDelete = groups.find((g) => g.id === groupId);
          if (groupToDelete) {
            setGroups((prev) => prev.filter((g) => g.id !== groupId));
            setPolicies((prev) => prev.filter((p) => p.scope !== groupToDelete.name));
          }
        }
      };;
      const [sessions, setSessions] = useState(SAMPLESESSIONS);
      const [sessionSearch, setSessionSearch] = useState('');
      const [sessionStatusFilter, setSessionStatusFilter] = useState('all');
      const [groupSearch, setGroupSearch] = useState('');

      const filteredUsers = users.filter((u) => {
        const q = searchTerm.toLowerCase();
        const matchesSearch = u.username.toLowerCase().includes(q) || u.email.toLowerCase().includes(q);
        const matchesRole = filterRole === 'All Users' || u.role === filterRole;
        return matchesSearch && matchesRole;
      });

      const today = getTodayISO();
      const todaysActiveUserIds = new Set(users.filter((u) => u.lastActiveDate === today && u.status === 'active').map((u) => u.id));
      const todaysActiveCount = todaysActiveUserIds.size;

      const handleSaveUser = (user) => {
        if (user.id) {
          setUsers(users.map((u) => (u.id === user.id ? user : u)));
        } else {
          setUsers([...users, { ...user, id: Date.now(), lastLogin: 'Never', failedAttempts: 0, lastActiveDate: null }]);
        }
        setEditingUser(null);
      };

      const handleDeleteUser = (id) => {
        if (confirm('Are you sure you want to delete this user?')) {
          setUsers(users.filter((u) => u.id !== id));
        }
      };

      const filteredSessions = useMemo(() => {
        return sessions.filter((s) => {
          const q = sessionSearch.toLowerCase();
          const matches = s.username.toLowerCase().includes(q) || s.ip.toLowerCase().includes(q) || s.device.toLowerCase().includes(q);
          const statusMatch = sessionStatusFilter === 'all' || s.status === sessionStatusFilter;
          return matches && statusMatch;
        });
      }, [sessions, sessionSearch, sessionStatusFilter]);

      const activeSessionsCount = sessions.filter((s) => s.status === 'active').length;

      const handleTerminateSession = (id) => {
        if (confirm('Terminate this session?')) {
          setSessions(sessions.map((s) => (s.id === id ? { ...s, status: 'terminated', lastSeen: 'Just now' } : s)));
        }
      };

      const handleTerminateAllActive = () => {
        if (confirm('Terminate all active sessions?')) {
          setSessions(sessions.map((s) => (s.status === 'active' ? { ...s, status: 'terminated', lastSeen: 'Just now' } : s)));
        }
      };

      const policyCategories = ['All', ...new Set(policies.map((p) => p.category))];

      const filteredPolicies = useMemo(() => {
        return policies.filter((policy) => {
          const q = policySearch.toLowerCase();
          const matchesSearch = policy.name.toLowerCase().includes(q) || policy.category.toLowerCase().includes(q) || policy.description.toLowerCase().includes(q);
          const matchesScope = policyScopeFilter === 'All' || policy.scope === policyScopeFilter;
          const matchesCategory = policyCategoryFilter === 'All' || policy.category === policyCategoryFilter;
          return matchesSearch && matchesScope && matchesCategory;
        });
      }, [policies, policySearch, policyScopeFilter, policyCategoryFilter]);

      const handlePolicyEnabledChange = (id, checked) => {
        setPolicies((prev) => prev.map((p) => {
          if (p.id !== id) return p;
          return { ...p, enabled: checked, value: p.type === 'toggle' ? checked : p.value };
        }));
      };

      const handlePolicyValueChange = (id, value) => {
        setPolicies((prev) => prev.map((p) => (p.id === id ? { ...p, value } : p)));
      };

      const handleResetPolicies = () => {
        const groupPolicies = policies.filter((p) => !['Admin', 'User'].includes(p.scope));
        setPolicies([...createDefaultPolicies(), ...groupPolicies]);
      };

      const handleSaveGroup = (groupData) => {
        if (groupData.id) {
          const existingGroup = groups.find((g) => g.id === groupData.id);
          setGroups((prev) => prev.map((g) => (g.id === groupData.id ? { ...g, name: groupData.name } : g)));
          if (existingGroup && existingGroup.name !== groupData.name) {
            setPolicies((prev) => prev.map((p) => (p.scope === existingGroup.name ? { ...p, scope: groupData.name } : p)));
          }
        } else {
          const newGroupId = `group-${Date.now()}`;
          const newGroup = { id: newGroupId, name: groupData.name, createdAt: new Date().toLocaleString() };
          const groupPoliciesSet = clonePoliciesForScope(groupData.name);
          setGroups((prev) => [...prev, newGroup]);
          setPolicies((prev) => [...prev, ...groupPoliciesSet]);
        }
        setEditingGroup(null);
      };

      const groupList = useMemo(() => {
        return groups.filter((group) => group.name.toLowerCase().includes(groupSearch.toLowerCase()));
      }, [groups, groupSearch]);

      const enabledPoliciesCount = policies.filter((p) => p.enabled).length;
      const adminPoliciesCount = policies.filter((p) => p.scope === 'Admin').length;
      const userPoliciesCount = policies.filter((p) => p.scope === 'User').length;
      const groupPoliciesCount = policies.filter((p) => !['Admin', 'User'].includes(p.scope)).length;

      return (
        <div className="app-container">
          <header className="header">
            <div className="header-content">
              <div className="header-title">
                <div className="header-icon">SPA</div>
                <div>
                  <h1>Security Policy Admin Console</h1>
                  <div className="header-subtitle">Enterprise user management, policy control, and session governance</div>
                </div>
              </div>
            </div>
          </header>

          <main className="main-content">
            <div className="tabs-container">
              <button className={`tab-button ${activeTab === 'users' ? 'active' : ''}`} onClick={() => setActiveTab('users')}><span className="tab-icon">◉</span>Users</button>
              <button className={`tab-button ${activeTab === 'policies' ? 'active' : ''}`} onClick={() => setActiveTab('policies')}><span className="tab-icon">◆</span>Policies</button>
              <button className={`tab-button ${activeTab === 'groups' ? 'active' : ''}`} onClick={() => setActiveTab('groups')}><span className="tab-icon">▣</span>Groups</button>
              <button className={`tab-button ${activeTab === 'sessions' ? 'active' : ''}`} onClick={() => setActiveTab('sessions')}><span className="tab-icon">◌</span>Active Sessions</button>
            </div>

            {activeTab === 'users' && (
              <UsersTab
                users={filteredUsers}
                searchTerm={searchTerm}
                setSearchTerm={setSearchTerm}
                filterRole={filterRole}
                setFilterRole={setFilterRole}
                todaysActiveCount={todaysActiveCount}
                onEdit={setEditingUser}
                onDelete={handleDeleteUser}
                onAdd={() => setEditingUser({ username: '', email: '', role: 'All Users', status: 'active' })}
              />
            )}

            {activeTab === 'policies' && (
              <PoliciesTab
                policies={filteredPolicies}
                allPolicies={policies}
                search={policySearch}
                setSearch={setPolicySearch}
                scopeFilter={policyScopeFilter}
                setScopeFilter={setPolicyScopeFilter}
                categoryFilter={policyCategoryFilter}
                setCategoryFilter={setPolicyCategoryFilter}
                categories={policyCategories}
                onEnabledChange={handlePolicyEnabledChange}
                onValueChange={handlePolicyValueChange}
                onReset={handleResetPolicies}
                enabledPoliciesCount={enabledPoliciesCount}
                adminPoliciesCount={adminPoliciesCount}
                userPoliciesCount={userPoliciesCount}
                groupPoliciesCount={groupPoliciesCount}
                groups={groups}
              />
            )}

            {activeTab === 'groups' && (
              <GroupsTab
                groups={groupList}
                allPolicies={policies}
                search={groupSearch}
                setSearch={setGroupSearch}
                onAdd={() => setEditingGroup({ name: '' })}
                onEdit={setEditingGroup}
                onEnabledChange={handlePolicyEnabledChange}
                onValueChange={handlePolicyValueChange} onDeleteGroup={handleDeleteGroup}
              />
            )}

            {activeTab === 'sessions' && (
              <ActiveSessionsTab
                sessions={filteredSessions}
                totalActive={activeSessionsCount}
                search={sessionSearch}
                setSearch={setSessionSearch}
                statusFilter={sessionStatusFilter}
                setStatusFilter={setSessionStatusFilter}
                onTerminate={handleTerminateSession}
                onTerminateAll={handleTerminateAllActive}
              />
            )}
          </main>

          {editingUser && <UserModal user={editingUser} onSave={handleSaveUser} onClose={() => setEditingUser(null)} />}
          {editingGroup && <GroupModal group={editingGroup} onSave={handleSaveGroup} onClose={() => setEditingGroup(null)} />}
        </div>
      );
    }

    function UsersTab({ users, searchTerm, setSearchTerm, filterRole, setFilterRole, todaysActiveCount, onEdit, onDelete, onAdd }) {
      return (
        <div className="section-card">
          <div className="section-header">
            <h2 className="section-title">User Management</h2>
            <p className="section-description">Manage user accounts and access visibility</p>
          </div>

          <div className="search-filter-bar">
            <input type="text" className="search-input" placeholder="Search by username or email..." value={searchTerm} onChange={(e) => setSearchTerm(e.target.value)} />
            <select className="filter-select" value={filterRole} onChange={(e) => setFilterRole(e.target.value)}>
              {ROLESLIST.map((role) => <option key={role} value={role}>{role}</option>)}
            </select>
            <button className="btn btn-primary" onClick={onAdd}>Add User</button>
          </div>

          <div className="stats-row">
            <div className="stat-card"><div className="stat-label">Total Users</div><div className="stat-value">{users.length}</div><div className="stat-sub">Currently visible with applied filters</div></div>
            <div className="stat-card"><div className="stat-label">Daily Active Users Today</div><div className="stat-value">{todaysActiveCount}</div><div className="stat-sub">Unique users with activity recorded for today</div></div>
          </div>

          {users.length === 0 ? (
            <div className="empty-state">
              <div className="empty-state-icon">🔍</div>
              <div className="empty-state-text">No users found</div>
              <div className="empty-state-subtext">Try adjusting your search or filters</div>
            </div>
          ) : (
            <div className="table-container">
              <table className="data-table">
                <thead>
                  <tr><th>Username</th><th>Email</th><th>Role</th><th>Status</th><th>Last Login</th><th>Failed Attempts</th><th>Actions</th></tr>
                </thead>
                <tbody>
                  {users.map((user) => (
                    <tr key={user.id}>
                      <td><strong>{user.username}</strong></td>
                      <td>{user.email}</td>
                      <td><code>{user.role}</code></td>
                      <td><span className={`status-badge ${user.status === 'active' ? 'status-active' : user.status === 'locked' ? 'status-locked' : 'status-pending'}`}><span className={`dot ${user.status === 'active' ? 'dot-green' : user.status === 'locked' ? 'dot-red' : 'dot-yellow'}`}></span>{user.status}</span></td>
                      <td>{user.lastLogin}</td>
                      <td><span style={{ color: user.failedAttempts > 0 ? 'var(--color-error)' : 'inherit' }}>{user.failedAttempts}</span></td>
                      <td>
                        <div style={{ display: 'flex', gap: '8px', flexWrap: 'wrap' }}>
                          <button className="btn btn-secondary" onClick={() => onEdit(user)}>Edit</button>
                          <button className="btn btn-danger" onClick={() => onDelete(user.id)}>Delete</button>
                        </div>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          )}

          <div className="info-card">
            <div className="info-icon">ℹ️</div>
            <div className="info-content">
              <div className="info-title">User Management Tips</div>
              <div className="info-text">Users can be filtered by role, edited, and removed from this section. Locked accounts and failed attempts remain visible for review.</div>
            </div>
          </div>
        </div>
      );
    }

    function PoliciesTab({ policies, allPolicies, search, setSearch, scopeFilter, setScopeFilter, categoryFilter, setCategoryFilter, categories, onEnabledChange, onValueChange, onReset, enabledPoliciesCount, adminPoliciesCount, userPoliciesCount, groupPoliciesCount, groups }) {
      const groupedPolicies = policies.reduce((acc, policy) => {
        if (!acc[policy.category]) acc[policy.category] = [];
        acc[policy.category].push(policy);
        return acc;
      }, {});

      const scopeOptions = ['All', 'Admin', 'User', ...groups.map((g) => g.name)];

      return (
        <div className="section-card">
          <div className="section-header">
            <h2 className="section-title">Policies</h2>
            <p className="section-description">Enable policies and configure them with dedicated filters for User, Admin, and Group scope.</p>
          </div>

          <div className="search-filter-bar">
            <input type="text" className="search-input" placeholder="Search policies by name, category, or description..." value={search} onChange={(e) => setSearch(e.target.value)} />
            <select className="filter-select" value={scopeFilter} onChange={(e) => setScopeFilter(e.target.value)}>
              {scopeOptions.map((option) => <option key={option} value={option}>{option === 'All' ? 'All Roles' : option}</option>)}
            </select>
            <select className="filter-select" value={categoryFilter} onChange={(e) => setCategoryFilter(e.target.value)}>
              {categories.map((category) => <option key={category} value={category}>{category}</option>)}
            </select>
            <button className="btn btn-secondary" onClick={onReset}>Reset Policies</button>
          </div>

          <div className="stats-row">
            <div className="stat-card"><div className="stat-label">Total Policies</div><div className="stat-value">{allPolicies.length}</div><div className="stat-sub">All configured policy records</div></div>
            <div className="stat-card"><div className="stat-label">Enabled Policies</div><div className="stat-value">{enabledPoliciesCount}</div><div className="stat-sub">Policies currently enabled</div></div>
            <div className="stat-card"><div className="stat-label">Admin Scope</div><div className="stat-value">{adminPoliciesCount}</div><div className="stat-sub">Policies available to admin</div></div>
            <div className="stat-card"><div className="stat-label">User Scope</div><div className="stat-value">{userPoliciesCount}</div><div className="stat-sub">Policies available to user</div></div>
            <div className="stat-card"><div className="stat-label">Group Scope</div><div className="stat-value">{groupPoliciesCount}</div><div className="stat-sub">Policies assigned to created groups</div></div>
          </div>

          {Object.keys(groupedPolicies).length === 0 ? (
            <div className="empty-state">
              <div className="empty-state-icon">📭</div>
              <div className="empty-state-text">No policies found</div>
              <div className="empty-state-subtext">Try adjusting policy search or filters</div>
            </div>
          ) : (
            Object.entries(groupedPolicies).map(([category, categoryPolicies]) => (
              <div key={category}>
                <h3 className="subsection-title">{category}</h3>
                <div className="policy-grid">
                  {categoryPolicies.map((policy) => <PolicyCard key={policy.id} policy={policy} onEnabledChange={onEnabledChange} onValueChange={onValueChange} />)}
                </div>
              </div>
            ))
          )}

          <div className="info-card">
            <div className="info-icon">🔐</div>
            <div className="info-content">
              <div className="info-title">Policy Scope Filter</div>
              <div className="info-text">Every policy is available for Admin and User scope by default, and each newly created group also receives the complete policy set for editing at any time.</div>
            </div>
          </div>
        </div>
      );
    }

    function GroupsTab({ groups, allPolicies, search, setSearch, onAdd, onEdit, onEnabledChange, onValueChange, onDeleteGroup }) {
      const [expandedGroup, setExpandedGroup] = useState(null);
      const [groupPolicySearch, setGroupPolicySearch] = useState('');
      const [groupCategoryFilter, setGroupCategoryFilter] = useState('All');

      const currentGroupPolicies = useMemo(() => {
        if (!expandedGroup) return [];
        return allPolicies.filter((policy) => {
          const matchesScope = policy.scope === expandedGroup;
          const q = groupPolicySearch.toLowerCase();
          const matchesSearch = policy.name.toLowerCase().includes(q) || policy.category.toLowerCase().includes(q) || policy.description.toLowerCase().includes(q);
          const matchesCategory = groupCategoryFilter === 'All' || policy.category === groupCategoryFilter;
          return matchesScope && matchesSearch && matchesCategory;
        });
      }, [allPolicies, expandedGroup, groupPolicySearch, groupCategoryFilter]);

      const currentCategories = ['All', ...new Set(allPolicies.filter((p) => p.scope === expandedGroup).map((p) => p.category))];
      const groupedPolicies = currentGroupPolicies.reduce((acc, policy) => {
        if (!acc[policy.category]) acc[policy.category] = [];
        acc[policy.category].push(policy);
        return acc;
      }, {});

      return (
        <div className="section-card">
          <div className="section-header">
            <h2 className="section-title">Groups</h2>
            <p className="section-description">Create groups, review all groups added earlier, and edit every policy for them whenever needed.</p>
          </div>

          <div className="search-filter-bar">
            <input type="text" className="search-input" placeholder="Search groups by name..." value={search} onChange={(e) => setSearch(e.target.value)} />
            <button className="btn btn-primary" onClick={onAdd}>Add Group</button>
          </div>

          <div className="stats-row">
            <div className="stat-card"><div className="stat-label">Total Groups</div><div className="stat-value">{groups.length}</div><div className="stat-sub">Groups added and available for policy editing</div></div>
            <div className="stat-card"><div className="stat-label">Expanded Group</div><div className="stat-value">{expandedGroup || 'None'}</div><div className="stat-sub">Use View Policies to open policy controls</div></div>
          </div>

          {groups.length === 0 ? (
            <div className="empty-state">
              <div className="empty-state-icon">📁</div>
              <div className="empty-state-text">No groups added yet</div>
              <div className="empty-state-subtext">Use Add Group to create a new group with the full policy set</div>
            </div>
          ) : (
            <div className="group-list">
              {groups.map((group) => {
                const groupPolicies = allPolicies.filter((p) => p.scope === group.name);
                const enabledCount = groupPolicies.filter((p) => p.enabled).length;
                const isOpen = expandedGroup === group.name;
                return (
                  <div className="group-card" key={group.id}>
                    <div className="group-card-header">
                      <div>
                        <div className="group-name">{group.name}</div>
                        <div className="group-meta">Created: {group.createdAt} · Total Policies: {groupPolicies.length} · Enabled: {enabledCount}</div>
                      </div>
                      <div className="group-actions">
                        <button className="btn btn-secondary" onClick={() => onEdit(group)}>Rename Group</button>
                        <button className="btn btn-primary" onClick={() => setExpandedGroup(isOpen ? null : group.name)}>{isOpen ? 'Hide Policies' : 'View Policies'}</button>
                      
                        <button className="btn btn-danger" onClick={() => onDeleteGroup(group.id)}>Delete</button></div>
                    </div>

                    {isOpen && (
                      <div style={{ marginTop: '20px' }}>
                        <div className="search-filter-bar">
                          <input type="text" className="search-input" placeholder="Search this group's policies..." value={groupPolicySearch} onChange={(e) => setGroupPolicySearch(e.target.value)} />
                          <select className="filter-select" value={groupCategoryFilter} onChange={(e) => setGroupCategoryFilter(e.target.value)}>
                            {currentCategories.map((category) => <option key={category} value={category}>{category}</option>)}
                          </select>
                        </div>

                        {Object.keys(groupedPolicies).length === 0 ? (
                          <div className="empty-state">
                            <div className="empty-state-icon">📭</div>
                            <div className="empty-state-text">No group policies found</div>
                            <div className="empty-state-subtext">Try adjusting the search or category filter</div>
                          </div>
                        ) : (
                          Object.entries(groupedPolicies).map(([category, categoryPolicies]) => (
                            <div key={category}>
                              <h3 className="subsection-title">{category}</h3>
                              <div className="policy-grid">
                                {categoryPolicies.map((policy) => <PolicyCard key={policy.id} policy={policy} onEnabledChange={onEnabledChange} onValueChange={onValueChange} />)}
                              </div>
                            </div>
                          ))
                        )}
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
          )}

          <div className="info-card">
            <div className="info-icon">🧩</div>
            <div className="info-content">
              <div className="info-title">Group Policy Management</div>
              <div className="info-text">Each group keeps its own full copy of all existing policies, so previously added groups remain visible and editable at any point from this tab.</div>
            </div>
          </div>
        </div>
      );
    }

    function PolicyCard({ policy, onEnabledChange, onValueChange }) {
      return (
        <div className="policy-card">
          <div className="policy-card-header">
            <div>
              <div className="policy-name">{policy.name}</div>
              <div className="policy-tag">{policy.enabled ? 'Enabled' : 'Disabled'}</div>
            </div>
            <div className="policy-scope">{policy.scope}</div>
          </div>
          <div className="policy-description">{policy.description || 'No additional description provided.'}</div>
          <div className="policy-controls">
            <div className="checkbox-wrapper">
              <input type="checkbox" className="checkbox-input" checked={policy.enabled} onChange={(e) => onEnabledChange(policy.id, e.target.checked)} id={`policy-enabled-${policy.id}`} />
              <label htmlFor={`policy-enabled-${policy.id}`} className="checkbox-label">Enable policy</label>
            </div>

            {policy.type === 'number' && (
              <div className="policy-row">
                <label className="form-label">Value</label>
                <div className="policy-inline">
                  <input type="number" className="form-input" value={policy.value} min={policy.min ?? 0} disabled={!policy.enabled} onChange={(e) => onValueChange(policy.id, parseInt(e.target.value || 0, 10))} />
                  <div className="policy-tag">{policy.unit}</div>
                </div>
              </div>
            )}

            {policy.type === 'select' && (
              <div className="policy-row">
                <label className="form-label">Value</label>
                <select className="form-select" value={policy.value} disabled={!policy.enabled} onChange={(e) => onValueChange(policy.id, e.target.value)}>
                  {policy.options.map((option) => <option key={option} value={option}>{option}</option>)}
                </select>
              </div>
            )}

            {policy.type === 'textarea' && (
              <div className="policy-row">
                <label className="form-label">Value</label>
                <textarea className="form-textarea" value={policy.value} disabled={!policy.enabled} onChange={(e) => onValueChange(policy.id, e.target.value)} placeholder="Enter one item per line..."></textarea>
              </div>
            )}
          </div>
        </div>
      );
    }

    function ActiveSessionsTab({ sessions, totalActive, search, setSearch, statusFilter, setStatusFilter, onTerminate, onTerminateAll }) {
      return (
        <div className="section-card">
          <div className="section-header">
            <h2 className="section-title">Active Sessions</h2>
            <p className="section-description">Monitor and manage user login sessions across devices</p>
          </div>

          <div className="search-filter-bar">
            <input type="text" className="search-input" placeholder="Search by username, IP, or device..." value={search} onChange={(e) => setSearch(e.target.value)} />
            <select className="filter-select" value={statusFilter} onChange={(e) => setStatusFilter(e.target.value)}>
              <option value="all">All Statuses</option>
              <option value="active">Active</option>
              <option value="expired">Expired</option>
              <option value="terminated">Terminated</option>
            </select>
            <button className="btn btn-danger" onClick={onTerminateAll} disabled={totalActive === 0}>Terminate All Active</button>
          </div>

          <div className="stats-row">
            <div className="stat-card"><div className="stat-label">Active Sessions</div><div className="stat-value">{totalActive}</div><div className="stat-sub">Live sessions that can be terminated remotely</div></div>
            <div className="stat-card"><div className="stat-label">Total Sessions Filtered</div><div className="stat-value">{sessions.length}</div><div className="stat-sub">Includes active, expired, and terminated sessions</div></div>
          </div>

          {sessions.length === 0 ? (
            <div className="empty-state">
              <div className="empty-state-icon">🔍</div>
              <div className="empty-state-text">No sessions found</div>
              <div className="empty-state-subtext">Try adjusting your search or filters</div>
            </div>
          ) : (
            <div className="table-container">
              <table className="data-table">
                <thead>
                  <tr><th>User</th><th>IP Address</th><th>Device</th><th>Location</th><th>Started</th><th>Last Seen</th><th>Status</th><th>Actions</th></tr>
                </thead>
                <tbody>
                  {sessions.map((s) => (
                    <tr key={s.id}>
                      <td><strong>{s.username}</strong></td>
                      <td>{s.ip}</td>
                      <td>{s.device}</td>
                      <td>{s.location}</td>
                      <td>{s.startedAt}</td>
                      <td>{s.lastSeen}</td>
                      <td><span className={`status-badge ${s.status === 'active' ? 'status-active' : s.status === 'terminated' ? 'status-locked' : 'status-pending'}`}><span className={`dot ${s.status === 'active' ? 'dot-green' : s.status === 'terminated' ? 'dot-red' : 'dot-yellow'}`}></span>{s.status}</span></td>
                      <td><button className="btn btn-danger" disabled={s.status !== 'active'} onClick={() => onTerminate(s.id)}>Terminate</button></td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          )}

          <div className="info-card">
            <div className="info-icon">🛑</div>
            <div className="info-content">
              <div className="info-title">Session Security</div>
              <div className="info-text">Regularly review active sessions for suspicious locations or devices. Terminate unknown sessions immediately and consider forcing a password reset for affected accounts.</div>
            </div>
          </div>
        </div>
      );
    }

    function UserModal({ user, onSave, onClose }) {
      const [formData, setFormData] = useState(user);
      const handleChange = (field, value) => setFormData({ ...formData, [field]: value });
      const handleSubmit = (e) => { e.preventDefault(); onSave(formData); };

      return (
        <div className="modal-overlay" onClick={onClose}>
          <div className="modal-content" onClick={(e) => e.stopPropagation()}>
            <div className="modal-header">
              <h3 className="modal-title">{user.id ? 'Edit User' : 'Add New User'}</h3>
              <button className="close-button" onClick={onClose}>×</button>
            </div>
            <form onSubmit={handleSubmit}>
              <div className="form-field">
                <label className="form-label">Username</label>
                <input type="text" className="form-input" value={formData.username} onChange={(e) => handleChange('username', e.target.value)} required />
              </div>
              <div className="form-field" style={{ marginTop: '16px' }}>
                <label className="form-label">Email</label>
                <input type="email" className="form-input" value={formData.email} onChange={(e) => handleChange('email', e.target.value)} required />
              </div>
              <div className="form-field" style={{ marginTop: '16px' }}>
                <label className="form-label">Role</label>
                <select className="form-select" value={formData.role} onChange={(e) => handleChange('role', e.target.value)}>
                  {ROLESLIST.map((role) => <option key={role} value={role}>{role}</option>)}
                </select>
              </div>
              <div className="form-field" style={{ marginTop: '16px' }}>
                <label className="form-label">Status</label>
                <select className="form-select" value={formData.status} onChange={(e) => handleChange('status', e.target.value)}>
                  <option value="active">Active</option>
                  <option value="locked">Locked</option>
                  <option value="pending">Pending</option>
                </select>
              </div>
              <div style={{ display: 'flex', gap: '12px', marginTop: '20px', flexWrap: 'wrap' }}>
                <button type="submit" className="btn btn-primary">Save User</button>
                <button type="button" className="btn btn-secondary" onClick={onClose}>Cancel</button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    function GroupModal({ group, onSave, onClose }) {
      const [name, setName] = useState(group.name || '');
      const handleSubmit = (e) => {
        e.preventDefault();
        const trimmed = name.trim();
        if (!trimmed) return;
        onSave({ ...group, name: trimmed });
      };

      return (
        <div className="modal-overlay" onClick={onClose}>
          <div className="modal-content" onClick={(e) => e.stopPropagation()}>
            <div className="modal-header">
              <h3 className="modal-title">{group.id ? 'Rename Group' : 'Add Group'}</h3>
              <button className="close-button" onClick={onClose}>×</button>
            </div>
            <form onSubmit={handleSubmit}>
              <div className="form-field">
                <label className="form-label">Group Name</label>
                <input type="text" className="form-input" value={name} onChange={(e) => setName(e.target.value)} placeholder="Enter group name" required />
              </div>
              <div style={{ display: 'flex', gap: '12px', marginTop: '20px', flexWrap: 'wrap' }}>
                <button type="submit" className="btn btn-primary">Save Group</button>
                <button type="button" className="btn btn-secondary" onClick={onClose}>Cancel</button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
